<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic Drive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo">
        <svg class="logo-mark" width="40" height="36" viewBox="0 0 40 36" fill="none">
          <path d="M14.4 2L2 24.5L8.8 34H25.6L32.4 24.5L20 2H14.4Z" fill="#2684FC"/>
          <path d="M20 2L32.4 24.5L25.6 34H40L27.6 11.2L20 2Z" fill="#00AC47"/>
          <path d="M8.8 34H25.6L20 24H2L8.8 34Z" fill="#FFBA00"/>
        </svg>
        <span class="logo-text">Agentic Drive</span>
      </div>
    </div>

    <div class="topbar-search">
      <div class="search-pill" id="search-pill">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
        <input id="search-input" type="text" autocomplete="off"
               placeholder="Search your drive, or press Enter to ask the agents a question" />
        <button id="search-clear" class="icon-btn hidden" title="Clear">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="search-dropdown hidden" id="search-dropdown"></div>
    </div>

    <div class="topbar-right">
      <span id="mode-badge" class="mode-pill">checking mode…</span>
      <button class="icon-btn" id="activity-toggle" title="Agent activity">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 11h-2V7h2zm0 4h-2v-2h2z"/></svg>
      </button>
      <div class="avatar-wrap">
        <button class="avatar" id="avatar-btn" title="Account">AD</button>
        <div class="account-popover hidden" id="account-popover">
          <div class="account-identity">
            <div class="avatar avatar-lg">AD</div>
            <div class="account-name">Demo User</div>
            <div class="account-email">demo@agentic-drive.local</div>
          </div>
          <div class="popover-divider"></div>
          <div class="account-storage">
            <div class="storage-bar"><div class="storage-fill" id="popover-storage-fill"></div></div>
            <div class="storage-label" id="popover-storage-label">Loading storage…</div>
          </div>
          <div class="popover-divider"></div>
          <button class="popover-danger-btn" id="reset-drive-btn">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zm3-4h6l1 2H8zM9 10v8m3-8v8m3-8v8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            Reset drive — delete everything
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="new-btn-wrap">
        <button id="new-btn" class="new-btn">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
          New
        </button>
        <div id="new-menu" class="new-menu hidden">
          <button data-action="upload">
            <svg class="icon" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
            File upload
          </button>
          <button data-action="seed">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l1.8 5.6H19l-4.6 3.4 1.8 5.6L12 13.2 7.8 16.6l1.8-5.6L5 8h5.2z"/></svg>
            Load demo files
          </button>
        </div>
        <input id="file-input" type="file" hidden />
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="all" id="nav-all">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h7l2 2h7v2H4zM4 10h16v10H4z"/></svg>
          My Drive
        </button>
        <button class="nav-item" data-view="expenses" id="nav-expenses">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2zM8 7h8v2H8zm0 4h8v2H8z"/></svg>
          Expenses
        </button>
      </nav>

      <div class="nav-section-label">Workspaces</div>
      <nav class="nav" id="cluster-nav"></nav>

      <div class="sidebar-footer">
        <div class="storage-meter">
          <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
          <div class="storage-label" id="storage-label">No files yet</div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar" id="toolbar">
        <h1 id="view-title">My Drive</h1>
        <div class="toolbar-actions">
          <button class="icon-btn" id="view-list-btn" title="List view">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
          </button>
          <button class="icon-btn active" id="view-grid-btn" title="Grid view">
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
          </button>
          <span class="toolbar-sep"></span>
          <button class="icon-btn" id="details-toggle" title="View details">
            <svg class="icon" viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zM12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/></svg>
          </button>
        </div>
      </div>

      <div class="selection-bar hidden" id="selection-bar">
        <button class="icon-btn" id="selection-clear" title="Clear selection">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <span id="selection-count">0 selected</span>
        <div class="selection-actions">
          <button class="pill-btn" id="ask-selected-btn">Ask about these</button>
          <button class="pill-btn pill-btn-filled" id="draft-selected-btn">Draft from these</button>
          <button class="pill-btn pill-btn-danger" id="delete-selected-btn" title="Delete">
            <svg class="icon" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zm3-4h6l1 2H8z"/></svg>
          </button>
        </div>
      </div>

      <div class="file-area" id="file-area"></div>
    </main>

    <aside class="details-panel hidden" id="details-panel">
      <div class="details-tabs">
        <button class="tab active" data-tab="details">Details</button>
        <button class="tab" data-tab="activity">Activity</button>
      </div>
      <div class="details-body" id="details-body"></div>
    </aside>
  </div>

  <div id="file-menu" class="file-menu hidden">
    <button data-action="open">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3z"/><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z"/></svg>
      Open
    </button>
    <button data-action="delete" class="danger">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7zm3-4h6l1 2H8z"/></svg>
      Delete
    </button>
  </div>

  <div id="file-modal" class="modal hidden">
    <div class="modal-card">
      <button class="modal-close" data-close-modal="file-modal">&times;</button>
      <h3 id="modal-title"></h3>
      <pre id="modal-body"></pre>
    </div>
  </div>

  <div id="prompt-modal" class="modal hidden">
    <div class="modal-card modal-card-small">
      <button class="modal-close" data-close-modal="prompt-modal">&times;</button>
      <h3>Draft from <span id="prompt-count"></span> selected file(s)</h3>
      <p class="hint">The Synthesis Agent will read these files and write a new file back into the drive.</p>
      <input id="prompt-input" type="text" placeholder='e.g. "Draft a unified PRD from these"' />
      <button id="prompt-submit" class="pill-btn pill-btn-filled">Draft it</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
